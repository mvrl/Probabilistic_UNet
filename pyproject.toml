[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-unet"
version = "0.1.0"
description = "A packaged Probabilistic U-Net implementation with a Typer CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MVRL contributors" }]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "torch>=2.1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
probabilistic-unet = "probabilistic_unet.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["probabilistic_unet*"]
